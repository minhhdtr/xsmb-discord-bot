services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xsmb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-xsmb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xsmb} -d ${POSTGRES_DB:-xsmb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not published by default. Uncomment to reach the database with psql
    # from the host.
    # ports:
    #   - "127.0.0.1:5432:5432"

  core:
    build: ./services/core
    env_file: .env
    # READ THIS BEFORE UNCOMMENTING THE ports: BLOCK BELOW.
    #
    # This API has no authentication. That is safe today only because Docker
    # isolates bridge networks from each other, so nothing outside this compose
    # project can reach it - the only containers that can are db and bot.
    #
    # Publishing a port breaks exactly that assumption. Every process on the
    # host could then reach five endpoints that write: silence the daily
    # announcement, burn an announcement claim, unsubscribe a channel.
    #
    # If you need the port - to run analysis from the host, say - add
    # authentication at the same time. Not afterwards.
    #
    # ports:
    #   - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xsmb}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-xsmb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The API answering is what "core is up" means to anything downstream.
    # Without this, depends_on only waits for the container to start, which is
    # true several seconds before the first request can be served.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Not started by `docker compose up`. Run it by hand for a large backfill:
  #   docker compose run --rm backfill --from 01/10/2005
  backfill:
    build: ./services/core
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xsmb}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-xsmb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["core", "backfill"]

  # The Discord client.
  bot:
    build: ./services/bot
    # Deliberately no env_file: this service needs none of core's database or
    # crawler settings, and naming what it does need keeps that visible.
    #
    # The `:?` on the token makes compose refuse to start with a readable
    # message rather than the container crash-looping on a missing variable.
    environment:
      CORE_URL: http://core:8080
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      COMMAND_PREFIX: ${COMMAND_PREFIX:-!xsmb}
      GOLD_PREFIX: ${GOLD_PREFIX:-!gold}
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
