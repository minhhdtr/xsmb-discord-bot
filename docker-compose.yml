services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xsmb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xsmb}
      POSTGRES_DB: ${POSTGRES_DB:-xsmb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xsmb} -d ${POSTGRES_DB:-xsmb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Not published by default. Uncomment to reach the database with psql
    # from the host.
    # ports:
    #   - "127.0.0.1:5432:5432"

  bot:
    build: ./services/core
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xsmb}:${POSTGRES_PASSWORD:-xsmb}@db:5432/${POSTGRES_DB:-xsmb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Not started by `docker compose up`. Run it by hand for a large backfill:
  #   docker compose run --rm backfill --from 01/10/2005
  backfill:
    build: ./services/core
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xsmb}:${POSTGRES_PASSWORD:-xsmb}@db:5432/${POSTGRES_DB:-xsmb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["xsmb-discord-bot", "backfill"]

volumes:
  pgdata:
